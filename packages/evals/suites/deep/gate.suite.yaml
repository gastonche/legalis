name: deep-gate
description: >
  AI sites 2+3 — synthesis + the self-eval judge gate (answerWithSelfEval) with
  REAL models over the real corpus index, compared side by side. Deterministic
  grounding checks + LLM-as-judge faithfulness/quality + latency budgets.
providers:
  - kind: mock
    name: gate-gpt-4o-mini
    model: gpt-4o-mini
  - kind: mock
    name: gate-gpt-4o
    model: gpt-4o
judge:
  provider: openai
  model: gpt-4o-mini
cases:
  - id: labour-dismissal
    description: EN labour question — grounded, verified, faithful to the statute
    prompt: Can my employer dismiss me without notice?
    source: |
      Labour Code of Cameroon, Section 34: (1) A contract of employment of unspecified
      duration may be terminated at any time at the will of either party. Such termination
      shall be subject to the condition that previous notice is given by the party taking
      the initiative of terminating the contract. Notification of termination shall be made
      in writing to the other party and shall set out the reason for the termination.
      (2) The notice period shall start to run from the date of such notification.
      Section 36: dismissal without notice is possible only in the event of serious
      misconduct, subject to the findings of the competent court as regards the gravity
      of the misconduct. Whenever a contract of unspecified duration is terminated
      without notice or without the full notice period being observed, the responsible
      party shall pay the other party compensation corresponding to the remuneration the
      worker would have received during the remainder of the notice period.
      Section 39: Every wrongful termination of a contract may entail damages; the
      competent court may ascertain the wrongful nature of the termination. A worker
      with at least two years of continuous service may also be entitled to severance
      pay (dismissal compensation) unless dismissed for serious misconduct.
    graders:
      - type: citations-grounded
      - type: cites-source
        sourceId: labour-en
      - type: banner-status
        anyOf: [verified, partial]
      - type: scope-boundary
      - type: judge-faithfulness
        threshold: 0.7
      - type: judge-quality
        threshold: 0.7
        rubric: >
          Clear plain-language legal information for a layperson; states which legal
          regime governs; cites its sources; does not apply the law to the user's
          specific facts; recommends a qualified Cameroonian lawyer for specifics.
      - type: latency-budget
        maxMs: 120000

  - id: ohada-company-fr
    description: FR business question — OHADA regime; the gate may honestly downgrade on thin retrieval
    prompt: Quelle loi régit une société commerciale au Cameroun?
    graders:
      - type: citations-grounded
        expectSome: false
      - type: regime-is
        value: ohada
      - type: scope-boundary
      # Baseline 0.5: FR retrieval is thin for broad definitional company-law
      # questions (the gate honestly downgrades). Raise to 0.7 once the corpus
      # gains the AUSCGIE intro/scope articles or FR retrieval improves.
      - type: judge-quality
        threshold: 0.5
        rubric: >
          Réponse claire en langage simple; indique le régime applicable (OHADA);
          cite ses sources; ne donne pas de conseil juridique personnalisé;
          recommande un avocat camerounais qualifié.

  - id: out-of-corpus-refusal
    description: foreign-jurisdiction question — must refuse, not hallucinate
    prompt: What is the inheritance tax rate in Germany?
    graders:
      - type: honest-refusal
      - type: banner-status
        anyOf: [downgraded]
      - type: scope-boundary
